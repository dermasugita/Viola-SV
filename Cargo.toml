[package]
name = "viola"
version = "1.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "viola"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.86"
chrono = "0.4.38"
chrono-tz = "0.9.0"
derive-getters = "0.4.0"
pyo3 = "0.20.0"
regex = "1.10.5"
url = "2.5.0"
